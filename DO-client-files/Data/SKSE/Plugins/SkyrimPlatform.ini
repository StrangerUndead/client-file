[Debug]
; 0 - trace, 1 - debug, 2 - info, 3 - warn, 4 - error, 5 - critical, 6 - none
LogLevel = 2
; If enabled, it will run the cmd with the game console data
Cmd = false
; Set left offset for cmd
CmdOffsetLeft = 0
; Set top offset for cmd
CmdOffsetTop = 720
; Set width for cmd
CmdWidth = 1900
; Set height for cmd
CmdHeight = 317
; Set Cmd stay on top of others windows
CmdIsAlwaysOnTop = false

[Main]
; List of plugin folders to load plugins from (pinned by the Daedric Online launcher)
PluginFolders = Data/Platform/Plugins

[Browser]
; Browser backend name: off/tilted/nirnlab/auto
BackendName = auto
